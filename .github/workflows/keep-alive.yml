# Reviewed and directed by the project author.
# Keep-alive: pings the Hugging Face Space so it does not go to sleep.
# Set the repository variable SPACE_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://<owner>-<space>.hf.space

name: keep-alive

on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/variables
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "Repository variable SPACE_URL is not set." >&2
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "${SPACE_URL%/}/api/variables"

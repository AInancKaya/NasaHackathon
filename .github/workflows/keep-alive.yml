# AI disclosure: this file was written with assistance from Claude (Anthropic), an AI coding assistant.
# Reviewed and directed by the project author.
# Keep-alive: pings the deployed app (Google Cloud Run) so the first visitor does not wait for a cold start.
# Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://app.terravestige.earth

name: keep-alive

on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/variables
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Repository variable APP_URL is not set." >&2
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "${APP_URL%/}/api/variables"
